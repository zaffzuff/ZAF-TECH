name: Build ZAF TECH Web App

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Regression checks
        run: npm run regression
      - name: Build
        run: npm run build
      - name: Smoke checks
        run: npm run smoke
