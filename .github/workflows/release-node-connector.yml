name: Release ZAF Tech Node Connector

# Releases are manual-only to avoid building/publishing on every connector change.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload"
        required: true
        default: "v1.6.7"
        type: string

permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/zaf-node-connector-package
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare ZAF Tech logo
        shell: powershell
        run: |
          choco install imagemagick.app -y --no-progress
          Copy-Item "..\..\public\zaf-tech-logo.png" "installer\zaf-tech-logo.png" -Force
          magick "installer/zaf-tech-logo.png" -background none -define icon:auto-resize=256,128,64,48,32,16 "installer/zaf-tech-logo.ico"
          Copy-Item "installer\zaf-tech-logo.ico" "..\zaf-node-connector-tray\zaf-tech-logo.ico" -Force
      - name: Install packaging dependencies
        run: npm install
      - name: Build Windows worker executable
        run: npm run build:win
      - name: Build Windows tray application
        shell: powershell
        run: |
          dotnet publish "..\zaf-node-connector-tray\ZafNodeConnectorTray.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o "dist\tray-publish"
          Copy-Item "dist\tray-publish\ZAF-TECH-Node-Connector.exe" "dist\ZAF-TECH-Node-Connector.exe" -Force
          if (-not (Test-Path "dist/ZAF-TECH-Node-Connector.exe")) { throw "Tray executable not found." }
          if (-not (Test-Path "dist/ZAF-TECH-Node-Connector-Worker.exe")) { throw "Worker executable not found." }
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force installer-dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\ZAF-TECH-Node-Connector.iss"
      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          $setupHash = (Get-FileHash "installer-dist/ZAF-TECH-Node-Connector-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$setupHash  ZAF-TECH-Node-Connector-Setup.exe" | Set-Content "ZAF-TECH-Node-Connector-SHA256SUMS.txt" -Encoding ascii
      - name: Upload assets to GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } elseif ($env:GITHUB_REF_NAME -eq "master") { "v1.6.7" } else { $env:GITHUB_REF_NAME }
          if (-not $tag) { throw "Release tag could not be determined." }

          $releasesJson = gh release list --repo "$env:GITHUB_REPOSITORY" --limit 100 --json tagName | ConvertFrom-Json
          $releaseExists = $false
          if ($releasesJson) {
            $releaseExists = @($releasesJson | Where-Object { $_.tagName -eq $tag }).Count -gt 0
          }

          if (-not $releaseExists) {
            Write-Host "Release $tag does not exist. Creating it..."
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title "ZAF Tech Node Connector $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          } else {
            Write-Host "Release $tag already exists."
          }

          gh release upload $tag "installer-dist/ZAF-TECH-Node-Connector-Setup.exe" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }

          gh release upload $tag "ZAF-TECH-Node-Connector-SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release checksum upload failed with exit code $LASTEXITCODE" }

          $releaseNotes = "## ZAF Tech Node Connector $tag`n`nWindows distribution release for the ZAF Tech local Pi Node Connector.`n`n### What is included`n`n* Windows x64 standalone Node Connector executable`n* Windows installer with ZAF Tech branding`n* Windows startup and tray integration`n* Local-only connector architecture`n`n* Read-only Pi Node, Stellar Core, Docker and WSL diagnostics`n* Live host and Node container resource telemetry`n* Availability and Node history collection`n* Protocol compatibility reporting for Protocol 27 and 28`n* SHA-256 checksum for release verification`n`n### Security and Privacy`n`nThe Connector runs locally and listens only on 127.0.0.1:39100. It does not expose Docker or the Pi Node to the internet.`n`nIt does not request wallet passwords, passphrases, seed phrases, or private keys; send Pi transactions; control the wallet; modify Pi Node configuration; start, stop, or restart the Pi Node; provide remote Docker access; or upload Node diagnostics to a central server by itself.`n`n### Compatibility`n`nThis release is $tag. Supported Pi protocols: 27 and 28.`n`n### Verification`n`nA SHA-256 checksum is provided with the release.`n`n### Release assets`n`n* ZAF-TECH-Node-Connector-Setup.exe - Windows x64 installer`n* ZAF-TECH-Node-Connector-SHA256SUMS.txt - SHA-256 checksum`n`n### Attribution`n`nZAF Tech Node Connector is maintained for the ZAF Tech project."
          gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title "ZAF Tech Node Connector $tag" --notes "$releaseNotes"
          if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE" }

          Write-Host "Release assets uploaded successfully to $tag."

          # Preserve existing releases and tags for rollback and checksum verification.
          Write-Host "Existing releases and tags have been preserved."
