name: Build ZAF TECH Node Connector

# Builds are manual-only to avoid consuming Actions minutes for every connector change.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/zaf-node-connector-package
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare ZAF TECH logo
        shell: powershell
        run: |
          choco install imagemagick.app -y --no-progress
          Copy-Item "..\..\public\zaf-tech-logo.png" "installer\zaf-tech-logo.png" -Force
          magick "installer/zaf-tech-logo.png" -background none -define icon:auto-resize=256,128,64,48,32,16 "installer/zaf-tech-logo.ico"
          Copy-Item "installer\zaf-tech-logo.ico" "..\zaf-node-connector-tray\zaf-tech-logo.ico" -Force
      - name: Install packaging dependencies
        run: npm install
      - name: Build Windows worker executable
        run: npm run build:win
      - name: Build Windows tray application
        shell: powershell
        run: |
          dotnet publish "..\zaf-node-connector-tray\ZafNodeConnectorTray.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o "dist\tray-publish"
          Copy-Item "dist\tray-publish\ZAF-TECH-Node-Connector.exe" "dist\ZAF-TECH-Node-Connector.exe" -Force
          if (-not (Test-Path "dist/ZAF-TECH-Node-Connector.exe")) { throw "Tray executable not found." }
          if (-not (Test-Path "dist/ZAF-TECH-Node-Connector-Worker.exe")) { throw "Worker executable not found." }
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force installer-dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\ZAF-TECH-Node-Connector.iss"
      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          $exeHash = (Get-FileHash "dist/ZAF-TECH-Node-Connector.exe" -Algorithm SHA256).Hash.ToLower()
          $workerHash = (Get-FileHash "dist/ZAF-TECH-Node-Connector-Worker.exe" -Algorithm SHA256).Hash.ToLower()
          $setupHash = (Get-FileHash "installer-dist/ZAF-TECH-Node-Connector-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          @("$exeHash  ZAF-TECH-Node-Connector.exe","$workerHash  ZAF-TECH-Node-Connector-Worker.exe","$setupHash  ZAF-TECH-Node-Connector-Setup.exe") | Set-Content "ZAF-TECH-Node-Connector-SHA256SUMS.txt" -Encoding ascii
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: ZAF-TECH-Node-Connector-SHA256
          path: tools/zaf-node-connector-package/ZAF-TECH-Node-Connector-SHA256SUMS.txt
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ZAF-TECH-Node-Connector-windows-x64
          path: |
            tools/zaf-node-connector-package/dist/ZAF-TECH-Node-Connector.exe
            tools/zaf-node-connector-package/dist/ZAF-TECH-Node-Connector-Worker.exe
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ZAF-TECH-Node-Connector-Setup-windows-x64
          path: tools/zaf-node-connector-package/installer-dist/ZAF-TECH-Node-Connector-Setup.exe
