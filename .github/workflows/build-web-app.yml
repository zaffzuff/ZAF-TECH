name: Build ZAF Tech Web App

on:
  push:
    branches: ["master"]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tools/**"
      - ".github/workflows/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vercel.json"
  pull_request:
    branches: ["master"]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tools/**"
      - ".github/workflows/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vercel.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Regression checks
        run: npm run regression
      - name: Official news behavior
        run: npm run test:news
      - name: Pre-integration safeguards
        run: npm run test:readiness
      - name: Build
        run: npm run build
      - name: Smoke checks
        run: npm run smoke
